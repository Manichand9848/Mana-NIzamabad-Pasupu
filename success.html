<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Order Success | Mana Nizamabad Pasupu</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

body{
font-family:Poppins;
background:#f5f5f5;
margin:0;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
box-sizing:border-box;
}

.box{
background:#fff;
padding:40px;
border-radius:12px;
width:100%;
max-width:500px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
box-sizing:border-box;
}

h1{
color:#1aa31a;
margin-bottom:10px;
font-size:24px;
}

h1.failed{
color:#d33;
}

p{
color:#555;
}

.order{
text-align:left;
margin-top:25px;
font-size:14px;
}

.order div{
margin-bottom:10px;
word-break:break-word;
}

.products{
background:#fafafa;
padding:15px;
border-radius:8px;
margin-top:10px;
}

.btn{
margin-top:25px;
padding:14px 20px;
background:#ffb703;
border:none;
cursor:pointer;
border-radius:6px;
font-weight:600;
width:100%;
font-size:15px;
}

.order-id{
font-size:13px;
color:#777;
margin-top:10px;
word-break:break-all;
}

.spinner{
margin:20px auto;
width:36px;
height:36px;
border:4px solid #eee;
border-top-color:#ffb703;
border-radius:50%;
animation:spin 0.8s linear infinite;
}

@keyframes spin{
to{ transform:rotate(360deg); }
}

@media (max-width:480px){
.box{
padding:25px 20px;
border-radius:8px;
}
h1{
font-size:20px;
}
}

</style>

</head>

<body>

<div class="box" id="statusBox">

<div class="spinner"></div>
<p>Confirming your payment, please wait…</p>

</div>

<script>

function goHome(){
window.location.href="index.html";
}

function goCart(){
window.location.href="cart.html";
}

(async function(){

const box = document.getElementById("statusBox");

const params = new URLSearchParams(window.location.search);
const orderId = params.get("order_id");

const localOrder = JSON.parse(localStorage.getItem("lastOrder") || "null");

if(!orderId){
box.innerHTML = `
<h1 class="failed">Order not found</h1>
<p>We couldn't find a payment reference for this page. If you completed a payment, please check your email/SMS from Cashfree, or contact us with your payment details.</p>
<button class="btn" onclick="goHome()">Back to Home</button>
`;
return;
}

try{

const response = await fetch("/api/save-order", {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
order_id: orderId,
name: localOrder ? localOrder.name : "",
email: localOrder ? localOrder.email : "",
phone: localOrder ? localOrder.phone : "",
address: localOrder ? localOrder.address : "",
products: localOrder ? localOrder.products : [],
total: localOrder ? localOrder.total : undefined
})
});

const data = await response.json();

if(!response.ok || !data.success){

box.innerHTML = `
<h1 class="failed">Payment not confirmed</h1>
<p>We checked with Cashfree and this order isn't marked as paid (status: ${data.status || "unknown"}). If money was deducted, it should reflect shortly, or please retry the payment.</p>
<div class="order-id">Order ID: ${orderId}</div>
<button class="btn" onclick="goCart()">Back to Cart</button>
`;
return;

}

const order = data.order || {};

let productsHTML = "";

(order.products || []).forEach(p=>{
productsHTML += `
<div>
${p.name} (Qty: ${p.qty}) - ₹${p.price * p.qty}
</div>
`;
});

box.innerHTML = `

<h1>Payment Successful 🎉</h1>

<p>Your order has been placed successfully.</p>

<div class="order">

<div class="order-id">Order ID: ${order.orderId || orderId}</div>

<div><b>Name:</b> ${order.customerName || ""}</div>

<div><b>Phone:</b> ${order.phone || ""}</div>

<div><b>Address:</b> ${order.address || ""}</div>

<hr>

<div><b>Products:</b></div>

<div class="products">
${productsHTML || "<div>No product details available</div>"}
</div>

<hr>

<div><b>Total Paid:</b> ₹${order.amount}</div>

</div>

<button class="btn" onclick="goHome()">Back to Home</button>

`;

/* Only clear the cart once we have a genuinely confirmed, saved order */
localStorage.removeItem("cart");
localStorage.removeItem("lastOrder");

}catch(error){

console.error("Order confirmation error:", error);

box.innerHTML = `
<h1 class="failed">Something went wrong</h1>
<p>We couldn't confirm your payment right now. Please don't retry the payment yet — contact us with this Order ID first.</p>
<div class="order-id">Order ID: ${orderId}</div>
<button class="btn" onclick="goHome()">Back to Home</button>
`;

}

})();

</script>

</body>

</html>
